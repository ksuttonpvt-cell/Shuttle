// Turas Lúbtha Driver: opens turaslubtha.com full screen (a Trusted Web Activity).
// Drivers sign in once and land in their own business's driver screen.
plugins {
    id 'com.android.application'
}

// Release signing comes from GitHub secrets (see .github/workflows/android.yml); without them
// only the test (debug) build is made.
def ks = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.turaslubtha.driver'
    compileSdk 34

    defaultConfig {
        applicationId 'com.turaslubtha.driver'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}

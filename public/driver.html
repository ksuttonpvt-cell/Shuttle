<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* apply the saved light/dark choice before the page draws */try{var t=localStorage.getItem("shuttle.theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver App</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shuttle">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  .next { border: 2px solid var(--red); }
  .next .big { font-size: 1.3rem; font-weight: 800; }
  .shift-bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; }
  .shift-bar > div { flex: 1; min-width: 180px; }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="wrap grid" style="max-width:900px">

  <section class="card" id="shift"></section>

  <section class="card" id="pushCard"></section>

  <section class="card next hidden" id="nextCard"></section>

  <section class="card hidden" id="routeCard"></section>

  <section class="card">
    <div class="tabs" style="margin-bottom:.6rem">
      <button class="active" data-tab="mine">My rides <span id="mineCount"></span></button>
      <button data-tab="open">Unassigned <span id="openCount"></span></button>
      <button data-tab="all">Everything open</button>
    </div>
    <div class="chips" role="group" aria-label="Show ride type">
      <span class="small muted">Show:</span>
      <button data-type="all" class="active">All <span data-count="all"></span></button>
      <button data-type="pickup">⬆ Pick ups <span data-count="pickup"></span></button>
      <button data-type="dropoff">⬇ Drop offs <span data-count="dropoff"></span></button>
    </div>
    <p class="small muted" style="margin-top:0">Numbers show the order to handle rides: on board / en route first, then overdue, urgent, and soonest — closest to you breaks ties.</p>
    <div id="list"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Map</h2><button class="btn-ghost btn-sm" id="recenter">Fit all</button></div>
    <div id="map" class="map map-tall"></div>
  </section>
</main>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/common.js"></script>
<script>
(async () => {
  const { $, $$, api, esc, fmtTime, relTime, statusBadge, typeBadge } = App;
  let me = await App.requireUser('driver');
  let vehicles = []; let rides = []; let tab = 'mine'; let watchId = null;
  // Pick up / drop off filter, remembered on this phone.
  let typeFilter = 'all';
  try { typeFilter = localStorage.getItem('shuttle.typeFilter') || 'all'; } catch { /* storage blocked */ }
  if (!['all', 'pickup', 'dropoff'].includes(typeFilter)) typeFilter = 'all';

  // ---------- shift / vehicle / location ----------
  async function drawShift() {
    ({ vehicles } = await api('/api/vehicles'));
    const usable = vehicles.filter((v) => v.status === 'available');
    const veh = vehicles.find((v) => v.id === me.vehicle_id);
    $('#shift').innerHTML = me.on_duty ? `
      <div class="card-head" style="margin:0">
        <div><h2 style="margin:0">On duty ✅</h2>
          <div class="muted small">Driving <b>${esc(veh?.name || '—')}</b>${veh ? ` · ${esc([veh.color, veh.make_model, veh.plate].filter(Boolean).join(' · '))} · ${veh.seats} seats` : ''}</div>
          <div class="small" id="gps">${watchId != null ? '📡 Sharing location' : '📡 Location off'}</div>
          <div class="small">${alerts.on ? '🔔 New-ride alerts on' : '🔕 New-ride alerts off'}</div>
        </div>
        <div class="actions" style="margin:0">
          <button class="btn-ghost btn-sm" id="gpsBtn">${watchId != null ? 'Stop sharing location' : 'Share my location'}</button>
          <button class="btn-ghost btn-sm" id="alertBtn">${alerts.on ? 'Turn alerts off' : 'Turn alerts on'}</button>
          <button class="btn-dark btn-sm" id="endShift">End shift</button>
        </div>
      </div>` : `
      <h2>Start your shift</h2>
      <div class="shift-bar">
        <div><label>Which vehicle are you driving?</label>
          <select id="vehSel"><option value="">Choose…</option>
          ${usable.map((v) => `<option value="${v.id}" ${v.driver_id && v.driver_id !== me.id ? 'disabled' : ''}>${esc(v.name)} — ${esc([v.color, v.make_model].filter(Boolean).join(' '))} (${v.seats} seats)${v.driver_name && v.driver_id !== me.id ? ' · in use by ' + esc(v.driver_name) : ''}</option>`).join('')}
          </select></div>
        <button class="btn-green btn-lg" id="startShift">Start shift</button>
      </div>
      <div id="shiftMsg"></div>
      ${!usable.length ? '<p class="small muted">No vehicles are set up yet — ask an admin to add one.</p>' : ''}`;
    if (me.on_duty) {
      $('#endShift').onclick = async () => { ({ user: me } = await api('/api/driver/shift', { body: { on_duty: false } })); stopGps(); drawShift(); route.clearLocal(); refresh(); };
      $('#gpsBtn').onclick = () => { watchId != null ? stopGps() : startGps(); drawShift(); };
      $('#alertBtn').onclick = () => { alerts.set(!alerts.on); drawShift(); };
    } else {
      $('#startShift').onclick = async () => {
        alerts.unlock(); // a tap lets the phone play the alert sound later
        try {
          ({ user: me } = await api('/api/driver/shift', { body: { on_duty: true, vehicle_id: Number($('#vehSel').value) } }));
          startGps(); drawShift(); refresh();
        } catch (err) { App.flash($('#shiftMsg'), err.message); }
      };
    }
  }

  let lastSent = 0; let lastSentAt = null; let myMarker = null;
  function startGps() {
    if (!navigator.geolocation) return alert('This device cannot share location.');
    watchId = navigator.geolocation.watchPosition((pos) => {
      const { latitude: lat, longitude: lng } = pos.coords;
      me.last_lat = lat; me.last_lng = lng;
      if (myMarker) myMarker.setLatLng([lat, lng]); else myMarker = L.marker([lat, lng], { icon: App.carIcon(), zIndexOffset: 900 }).bindPopup('You').addTo(map);
      // Send every 5 seconds, or sooner (2 s) after moving more than about 40 m.
      const moved = lastSentAt ? App.milesFromDealer(lat, lng, { dealer_lat: lastSentAt[0], dealer_lng: lastSentAt[1] }) * 1609 : Infinity;
      const since = Date.now() - lastSent;
      if (since > 5000 || (moved > 40 && since > 2000)) {
        lastSent = Date.now(); lastSentAt = [lat, lng];
        const { heading, speed } = pos.coords;
        api('/api/driver/location', { body: { lat, lng, heading: Number.isFinite(heading) ? heading : null, speed: Number.isFinite(speed) ? speed : null } }).catch(() => {});
      }
    }, (err) => { const g = $('#gps'); if (g) g.textContent = '📡 Location blocked: ' + err.message; watchId = null; },
    { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
  }
  function stopGps() { if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; }

  // ---------- rides ----------
  const map = App.makeMap($('#map'), { lat: Number(App.settings.dealer_lat), lng: Number(App.settings.dealer_lng) });
  App.dealerMarker(map, App.settings);
  const draw = App.ridesLayer(map);

  const NEXT_STEP = {
    assigned: ['en_route', 'Start — I\'m on my way', 'btn-blue'],
    en_route: ['onboard', 'Customer is on board', 'btn-blue'],
    onboard: ['completed', 'Ride complete ✓', 'btn-green'],
  };

  function rideHtml(r, big = false) {
    const mine = r.driver_id === me.id;
    const step = mine && NEXT_STEP[r.status];
    const dest = r.type === 'pickup'
      ? `Pick up at <b>${esc(r.address)}</b> → bring to dealership`
      : `Dealership → drop off at <b>${esc(r.address)}</b>`;
    return `
      <div class="ride ${r.rank === 1 ? 'first' : ''}" data-id="${r.id}">
        <div class="ride-top">
          <div>${r.rank ? `<span class="rank">${r.rank}</span>` : ''}<span class="ride-name ${big ? 'big' : ''}">${esc(r.customer_name)}</span>
            ${r.priority === 'urgent' ? '<span class="badge b-urgent">Urgent</span>' : ''}</div>
          <div>${typeBadge(r.type)} ${statusBadge(r.status)}</div>
        </div>
        <div class="ride-meta">
          <div>🕒 ${fmtTime(r.scheduled_at)} · ${relTime(r.scheduled_at)} · ${r.passengers} passenger${r.passengers > 1 ? 's' : ''}</div>
          <div>📍 ${dest}${r.distance_mi != null ? ` · ${r.distance_mi} mi` : ''}</div>
          ${r.notes ? `<div>📝 ${esc(r.notes)}</div>` : ''}
          ${r.driver_name && !mine ? `<div>🚐 ${esc(r.driver_name)}</div>` : ''}
          ${r.reasons ? `<div class="small">Why this order: ${esc(r.reasons.join(' · '))}</div>` : ''}
        </div>
        <div class="actions">
          ${!r.driver_id ? `<button class="btn-dark" data-claim>Take this ride</button>` : ''}
          ${step ? `<button class="${step[2]}" data-status="${step[0]}">${step[1]}</button>` : ''}
          <a class="btn btn-ghost" target="_blank" rel="noopener" href="${App.directionsUrl(r)}">🧭 Navigate</a>
          ${r.customer_phone ? `<a class="btn btn-ghost" href="${App.telLink(r.customer_phone)}">📞 Call</a>
            <a class="btn btn-ghost" href="sms:${r.customer_phone.replace(/[^\d+]/g, '')}">💬 Text</a>` : ''}
          ${mine && r.status === 'assigned' ? `<button class="btn-ghost" data-release>Give back</button>` : ''}
          ${mine ? `<button class="btn-ghost" data-cancel>Cancel ride</button>` : ''}
        </div>
      </div>`;
  }

  // ---------- new-ride alerts ----------
  // Beep + vibrate + banner when a new ride comes in or one is assigned to you.
  // When the app is in the background, a phone notification is shown instead (if allowed).
  const alerts = (() => {
    let on = true; let audio = null; let seen = null; const self = new Set(); // rides this driver took themselves
    try { on = localStorage.getItem('shuttle.alerts') !== 'off'; } catch { /* storage blocked */ }
    function unlock() {
      try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch { /* no audio */ }
    }
    function beep() {
      if (!audio) return;
      const t = audio.currentTime;
      [0, 0.25].forEach((d) => {
        const o = audio.createOscillator(); const g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.4, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.2);
        o.start(t + d); o.stop(t + d + 0.22);
      });
    }
    function banner(text) {
      let el = $('#rideAlert');
      if (!el) { el = document.createElement('div'); el.id = 'rideAlert'; el.className = 'ride-alert'; document.body.appendChild(el); el.onclick = () => el.remove(); }
      el.innerHTML = `🔔 ${esc(text)}<span class="small"> · tap to close</span>`;
      clearTimeout(el._t); el._t = setTimeout(() => el.remove(), 20000);
    }
    return {
      get on() { return on; },
      set(v) { on = v; if (on) unlock(); try { localStorage.setItem('shuttle.alerts', on ? 'on' : 'off'); } catch { /* storage blocked */ } },
      unlock,
      tookMyself(ids) { ids.forEach((id) => self.add(id)); },
      ding() { if (!on) return; beep(); if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); },
      // Compare this refresh's rides with the last one and alert on anything new for this driver.
      check(list) {
        const mineOrOpen = list.filter((r) => !r.driver_id || r.driver_id === me.id);
        const key = (r) => `${r.id}:${r.driver_id === me.id ? 'me' : 'open'}`;
        const now = new Set(mineOrOpen.map(key));
        if (seen && on && me.on_duty) {
          const fresh = mineOrOpen.filter((r) => !seen.has(key(r)) && !(r.driver_id === me.id && self.has(r.id)));
          if (fresh.length) {
            const r = fresh[0];
            const text = `${r.driver_id === me.id ? 'Ride assigned to you' : 'New ride'}: ${r.customer_name} — ${App.TYPE_LABEL[r.type]} ${fmtTime(r.scheduled_at)}${fresh.length > 1 ? ` (+${fresh.length - 1} more)` : ''}`;
            beep();
            if (navigator.vibrate) navigator.vibrate([250, 120, 250]);
            banner(text); // When the app is closed or the phone is locked, push notifications cover it instead.
          }
        }
        seen = now;
      },
    };
  })();
  document.addEventListener('click', () => { if (alerts.on) alerts.unlock(); }, { once: true });

  // ---------- lock-screen notifications (push) ----------
  // Works even when the app is closed or the phone is locked. On iPhone the site must be
  // added to the Home Screen and opened from there first (an Apple rule).
  const pushUI = (() => {
    const card = $('#pushCard');
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    let reg = null; let sub = null; let installPrompt = null; let msg = '';
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; draw(); });
    const toKey = (b64) => {
      const s = atob((b64 + '='.repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
      return Uint8Array.from(s, (c) => c.charCodeAt(0));
    };
    function draw() {
      const say = msg ? `<div class="small" style="margin-top:.5rem">${msg}</div>` : '';
      const install = installPrompt && !installed ? '<button class="btn-ghost btn-sm" data-push="install">📲 Install the Shuttle app</button>' : '';
      let body;
      if (isIOS && !installed) {
        body = `<p class="small" style="margin:.3rem 0">To get ride alerts on an iPhone's lock screen:</p>
          <ol class="small" style="margin:.2rem 0 0;padding-left:1.2rem">
            <li>Tap the <b>Share</b> button <span aria-hidden="true">(⬆ square with an arrow)</span> in Safari.</li>
            <li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li>
            <li>Open <b>Shuttle</b> from your home screen and sign in.</li>
            <li>Come back to this card and tap <b>Turn on notifications</b>.</li></ol>`;
      } else if (!supported) {
        body = '<p class="small" style="margin:.3rem 0">This browser can\'t show lock-screen notifications. Use <b>Chrome</b> on Android, or <b>Safari</b> on iPhone (added to the Home Screen).</p>';
      } else if (Notification.permission === 'denied') {
        body = `<p class="small" style="margin:.3rem 0">⚠️ Notifications are <b>blocked</b> for this site. Allow them in your phone's settings for ${installed ? 'the Shuttle app' : 'this browser'}, then reload this page.</p>`;
      } else if (sub) {
        body = `<p class="small" style="margin:.3rem 0">✅ <b>On for this phone.</b> New rides, rides assigned to you, and cancelled rides show on your lock screen, even when the app is closed. (They come while you're on duty.)</p>
          <div class="actions"><button class="btn-ghost btn-sm" data-push="test">Send a test</button><button class="btn-ghost btn-sm" data-push="off">Turn off</button>${install}</div>`;
      } else {
        body = `<p class="small" style="margin:.3rem 0">Get new rides on your lock screen, even when the app is closed or the phone is locked.</p>
          <div class="actions"><button class="btn-blue" data-push="on">🔔 Turn on notifications</button>${install}</div>`;
      }
      card.innerHTML = `<h2 style="margin:0">📲 Phone notifications</h2>${body}${say}`;
    }
    async function act(what) {
      msg = '';
      try {
        if (what === 'install') { installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; }
        if (what === 'on') {
          if (await Notification.requestPermission() !== 'granted') { msg = 'Notifications were not allowed. Tap Turn on again and choose <b>Allow</b>.'; return; }
          reg = reg || await navigator.serviceWorker.register('/sw.js');
          await navigator.serviceWorker.ready;
          const { key } = await api('/api/push');
          try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: toKey(key) }); } catch (e) {
            throw new Error(`This phone couldn't sign up for notifications. Check it's online and tap Turn on again. (${e.message})`);
          }
          await api('/api/push/subscribe', { body: { subscription: sub.toJSON() } });
          msg = 'Done. Tap <b>Send a test</b> to see one.';
        }
        if (what === 'test') { await api('/api/push/test', { body: {} }); msg = 'Test sent. It should appear in a few seconds.'; }
        if (what === 'off') {
          await api('/api/push/unsubscribe', { body: { endpoint: sub.endpoint } }).catch(() => {});
          await sub.unsubscribe().catch(() => {}); sub = null; msg = 'Notifications are off for this phone.';
        }
      } catch (err) { msg = `⚠️ ${esc(err.message)}`; } finally { draw(); }
    }
    card.addEventListener('click', (e) => { const b = e.target.closest('[data-push]'); if (b) act(b.dataset.push); });
    (async () => {
      if (supported) {
        try {
          reg = await navigator.serviceWorker.register('/sw.js');
          sub = await reg.pushManager.getSubscription();
          // Re-send it in case the server forgot this phone (harmless if it already knows it).
          if (sub && Notification.permission === 'granted') await api('/api/push/subscribe', { body: { subscription: sub.toJSON() } }).catch(() => {});
        } catch { /* leave it off */ }
      }
      draw();
    })();
  })();

  // ---------- route planner ----------
  // Check off several rides and get the quickest order (real road times when available),
  // drawn on the map with arrival times, plus one tap to open it all in Google Maps.
  const route = (() => {
    const card = $('#routeCard');
    let saved = null; let preview = null; let skipped = []; let picking = null; let msg = '';
    const pathLayer = L.layerGroup().addTo(map);
    const here = () => (me.last_lat != null ? { lat: me.last_lat, lng: me.last_lng } : null);
    const candidates = () => rides.filter((r) => r.lat != null && (r.driver_id === me.id || (!r.driver_id && me.on_duty)));
    function drawPath(rt) {
      pathLayer.clearLayers();
      if (!rt) return;
      L.polyline(rt.path, { color: '#1a73e8', weight: 6, opacity: 0.75, dashArray: rt.source === 'roads' ? null : '8 10' }).addTo(pathLayer);
      rt.stops.forEach((x, i) => {
        L.marker([x.lat, x.lng], { icon: L.divIcon({ className: '', html: `<div class="stop-num ${x.kind === 'dealer' ? 'done' : ''}">${i + 1}</div>`, iconSize: [22, 22], iconAnchor: [11, 30] }), zIndexOffset: 800 })
          .bindPopup(`<b>${i + 1}. ${esc(x.label)}</b><br>${esc(x.address || '')}<br>about ${fmtTime(x.eta)}`).addTo(pathLayer);
      });
    }
    // "Leave now → Pat 8:38 → Kim 8:50 → Back at dealership 9:28"
    const shortName = (x) => (x.kind === 'dealer' ? (x.label.startsWith('Back') ? 'Back at dealership' : 'Dealership') : x.label);
    const timeline = (rt) => `<div class="timeline">
        <div class="tl-row"><span class="tl-dot tl-start"></span><b>Leave now</b><span class="muted small">${fmtTime(rt.planned_at)}</span></div>
        ${rt.stops.map((x, i) => `<div class="tl-leg small muted">🚐 ${x.leg_min} min · ${x.leg_mi} mi</div>
          <div class="tl-row"><span class="tl-dot ${x.kind === 'dealer' ? 'tl-dealer' : ''}">${i + 1}</span><b>${esc(shortName(x))}${rt.seats && x.on_board != null && i < rt.stops.length - 1 ? ` <span class="seat-pill">👥 ${x.on_board}/${rt.seats}</span>` : ''}</b><span><b>${fmtTime(x.eta)}</b></span></div>`).join('')}
        <div class="route-total" style="margin-top:.5rem">Back at the dealership about ${fmtTime(rt.finish_at)} · ${rt.total_mi} mi total</div>
        <div class="small muted">${rt.source === 'roads' ? 'Real road driving times' : 'Estimated times (road info unavailable)'}, plus 3 min at each stop.</div></div>`;
    // How many people are checked, against the van's seats.
    function seatNote(list) {
      const veh = vehicles.find((v) => v.id === me.vehicle_id);
      if (!veh || !veh.seats) return '';
      const chosen = list.filter((r) => picking.has(r.id));
      const ups = chosen.filter((r) => r.type === 'pickup').reduce((n, r) => n + r.passengers, 0);
      const downs = chosen.filter((r) => r.type === 'dropoff').reduce((n, r) => n + r.passengers, 0);
      const most = Math.max(ups, downs);
      const all = ups + downs;
      const tone = most > veh.seats ? 'alert-err' : all > veh.seats ? 'alert-warn' : 'alert-ok';
      const say = most > veh.seats ? `Too many: ${most} ${ups >= downs ? 'pick-up' : 'drop-off'} passengers won't fit in ${veh.seats} seats. Uncheck some rides.`
        : all > veh.seats ? `${all} passengers in all, more than ${veh.seats} seats, so the route will drop people off before picking others up.`
        : `${all} passenger${all === 1 ? '' : 's'} · ${esc(veh.name)} has ${veh.seats} seats`;
      return `<div class="alert ${tone} small">👥 ${say}</div>`;
    }
    // Pick Google Maps, Apple Maps or Waze. Only Google Maps takes every stop at once;
    // the others go one stop at a time.
    const appPicker = () => `<div class="chips" role="group" aria-label="Directions app" style="margin-top:.7rem">
        <span class="small muted">Directions with:</span>
        ${Object.entries(App.NAV_APPS).map(([k, v]) => `<button data-nav="${k}" class="${App.navApp() === k ? 'active' : ''}">${v}</button>`).join('')}</div>`;
    function goButton(rt, starting) {
      const app = App.navApp(); const name = App.NAV_APPS[app];
      const attrs = `target="_blank" rel="noopener" style="margin-top:.6rem"${starting ? ' data-r="go"' : ''}`;
      const cls = starting ? 'btn btn-green btn-lg btn-block' : 'btn btn-blue btn-lg btn-block';
      if (app === 'google') {
        return `<a class="${cls}" ${attrs} href="${App.routeUrl(rt.stops)}">🧭 ${starting ? 'Start route' : 'Open route'} in Google Maps</a>
          <p class="small muted" style="margin:.4rem 0 0">Every stop opens in this order, for turn-by-turn directions to each customer and back to the dealership.${starting ? ' This also saves the route here.' : ''}</p>`;
      }
      const first = rt.stops[0];
      return `<a class="${cls}" ${attrs} href="${App.navUrl(first)}">🧭 ${starting ? 'Start' : 'Next stop'}: ${esc(shortName(first))} in ${name}</a>
        <p class="small muted" style="margin:.4rem 0 0">${name} takes one stop at a time. After each stop, come back here and tap the next one (or the 🧭 next to it below).${starting ? ' This also saves the route here.' : ''}</p>`;
    }
    const stopList = (rt, live) => `<ol class="route-list">${rt.stops.map((x, i) => `
      <li class="${live && i === 0 ? 'is-next' : ''}"><span class="stop-num ${x.kind === 'dealer' ? 'done' : ''}">${i + 1}</span>
        <div class="grow"><b>${esc(x.label)}</b><div class="small muted">${esc(x.address || '')}</div>
          <div class="small">${x.leg_mi} mi · ${x.leg_min} min drive · arrive about <b>${fmtTime(x.eta)}</b></div></div>
        ${live ? `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${App.navUrl(x)}" title="Directions in ${App.NAV_APPS[App.navApp()]}">🧭</a>` : ''}</li>`).join('')}</ol>
      <div class="route-total">${rt.total_mi} mi · about ${rt.total_min} min · back by ${fmtTime(rt.finish_at)}</div>
      <div class="small muted">${rt.source === 'roads' ? 'Based on real roads and typical driving times.' : 'Estimated from straight-line distance (road info was unavailable). Order is still a good guess.'} Includes ${3} min at each stop.${rt.stops.length > 10 ? ' Google Maps opens the first 10 stops.' : ''}</div>
      ${skipped.length ? `<div class="alert alert-warn small">Left out (no map spot): ${esc(skipped.join(', '))}</div>` : ''}`;
    function paint() {
      const list = candidates();
      if (saved) {
        card.innerHTML = `<div class="card-head" style="margin:0"><h2 style="margin:0">🗺 Your route</h2><span class="small muted">planned ${fmtTime(saved.planned_at)}</span></div>
          ${timeline(saved)}${appPicker()}${goButton(saved, false)}
          <details style="margin-top:.6rem" ${App.navApp() === 'google' ? '' : 'open'}><summary class="small">Stops with directions one at a time</summary>${stopList(saved, true)}</details>
          <div class="actions">
            <button class="btn-ghost" data-r="replan">🔄 Re-plan from here</button><button class="btn-ghost" data-r="edit">Change stops</button><button class="btn-ghost" data-r="clear">Clear route</button></div>${msg}`;
      } else if (preview) {
        card.innerHTML = `<h2 style="margin:0">🗺 Your trip</h2>${timeline(preview)}${appPicker()}${goButton(preview, true)}
          <details style="margin-top:.6rem"><summary class="small">See each stop</summary>${stopList(preview, false)}</details>
          <div class="actions"><button class="btn-ghost" data-r="save">Save without opening maps</button><button class="btn-ghost" data-r="back">Back</button></div>${msg}`;
      } else {
        if (list.length < 1) { card.classList.add('hidden'); return; }
        if (!picking) picking = new Set(list.filter((r) => r.driver_id === me.id).map((r) => r.id));
        for (const id of [...picking]) if (!list.some((r) => r.id === id)) picking.delete(id);
        card.innerHTML = `<h2 style="margin:0">🗺 Plan a route</h2>
          <p class="small muted" style="margin:.3rem 0">Check the rides you want to do in one trip. You'll get the quickest order and arrival times. Unassigned rides you check become yours when you use the route.</p>
          ${list.map((r) => `<label class="route-pick"><input type="checkbox" data-pick="${r.id}" ${picking.has(r.id) ? 'checked' : ''}>
            <span>${typeBadge(r.type)} <b>${esc(r.customer_name)}</b>${r.driver_id ? '' : ' <span class="badge s-requested">Unassigned</span>'}${r.status === 'onboard' ? ' <span class="small muted">(on board)</span>' : ''}
            <br><span class="small muted">${esc(r.address)} · ${fmtTime(r.scheduled_at)}</span></span></label>`).join('')}
          ${seatNote(list)}
          <div class="actions"><button class="btn-blue" data-r="plan" ${picking.size ? '' : 'disabled'}>Find the best route (${picking.size})</button></div>${msg}`;
      }
      card.classList.remove('hidden');
    }
    async function plan(ids, save, keepOrder = false) {
      msg = '<div class="small muted" style="margin-top:.5rem">Working out the quickest order…</div>'; paint();
      try {
        const r = await api('/api/route', { body: { ride_ids: ids, from: keepOrder && preview ? preview.start : here(), save, keep_order: keepOrder } });
        skipped = r.skipped || []; msg = '';
        if (save) { saved = r.route; preview = null; picking = null; } else preview = r.route;
        drawPath(saved || preview);
        if (save) refresh();
      } catch (err) { msg = `<div class="alert alert-err">${esc(err.message)}</div>`; }
      paint();
    }
    card.addEventListener('change', (e) => {
      const id = Number(e.target.dataset.pick); if (!id) return;
      e.target.checked ? picking.add(id) : picking.delete(id); paint();
    });
    card.addEventListener('click', async (e) => {
      const nav = e.target.closest('[data-nav]');
      if (nav) { App.setNavApp(nav.dataset.nav); paint(); refresh(); return; }
      const b = e.target.closest('[data-r]'); if (!b) return;
      msg = '';
      const act = b.dataset.r;
      if (act === 'go') {
        // The link opens Google Maps; save the same order here in the background.
        const ids = preview.stops.filter((x) => x.ride_id).map((x) => x.ride_id);
        alerts.tookMyself(ids);
        fetch('/api/route', { method: 'POST', keepalive: true, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ride_ids: ids, from: preview.start, save: true, keep_order: true }) })
          .then((r) => r.json()).then((d) => {
            if (d.route) { saved = d.route; preview = null; picking = null; drawPath(saved); refresh(); }
            else { msg = `<div class="alert alert-err">${esc(d.error || 'Could not save the route.')}</div>`; paint(); }
          }).catch(() => {});
        return; // don't redraw now, so the link can open
      }
      if (act === 'plan') return plan([...picking], false);
      if (act === 'save') alerts.tookMyself(preview.stops.filter((x) => x.ride_id).map((x) => x.ride_id));
      if (act === 'save') return plan(preview.stops.filter((x) => x.ride_id).map((x) => x.ride_id), true, true);
      if (act === 'replan') return plan(saved.stops.filter((x) => x.ride_id).map((x) => x.ride_id), true);
      if (act === 'back') { preview = null; drawPath(null); }
      if (act === 'edit') { picking = new Set(saved.stops.filter((x) => x.ride_id).map((x) => x.ride_id)); saved = null; await api('/api/route', { method: 'DELETE' }).catch(() => {}); drawPath(null); }
      if (act === 'clear') { saved = null; picking = null; await api('/api/route', { method: 'DELETE' }).catch(() => {}); drawPath(null); }
      paint();
    });
    return {
      async render() {
        if (!preview) {
          const was = saved && JSON.stringify(saved.stops.map((x) => x.ride_id));
          saved = (await api('/api/route')).route;
          if (!saved || was !== JSON.stringify(saved.stops.map((x) => x.ride_id))) drawPath(saved);
        }
        paint();
      },
      // A ride just accepted from an offer joins the saved route (re-planned for the best order).
      async addRide(id) {
        if (!saved) return;
        const ids = saved.stops.filter((x) => x.ride_id).map((x) => x.ride_id);
        if (!ids.includes(id)) await plan([...ids, id], true);
      },
      nextRideId: () => (saved ? (saved.stops.find((x) => x.ride_id) || {}).ride_id : null),
      clearLocal() { saved = null; preview = null; picking = null; drawPath(null); },
    };
  })();
  // ---------- ride offers ----------
  // When a ride is waiting and this driver is the closest free one, the server offers it:
  // a ding, a phone notification, and this pop-up with Take it / No thanks.
  const offers = (() => {
    let current = null; let busy = false;
    const sheet = document.createElement('div');
    sheet.className = 'offer-sheet hidden'; sheet.setAttribute('role', 'alertdialog'); sheet.setAttribute('aria-live', 'assertive');
    document.body.appendChild(sheet);
    const secondsLeft = (o) => Math.max(0, Math.round((new Date(o.expires_at) - Date.now()) / 1000));
    function paint() {
      if (!current || !secondsLeft(current)) { current = null; sheet.classList.add('hidden'); return; }
      const o = current;
      const where = o.type === 'pickup'
        ? `📍 ${esc(o.address)}<br><b>${o.miles} mi from you</b> (about ${o.minutes} min)`
        : `Customer is waiting at the dealership (<b>${o.miles} mi from you</b>, about ${o.minutes} min) → drop off at ${esc(o.address)}`;
      sheet.innerHTML = `<div class="offer-head"><b>${o.type === 'pickup' ? '🚐 Ride near you. Want it?' : '🚐 Drop off waiting. Want it?'}</b><span class="offer-timer">${secondsLeft(o)}s</span></div>
        <div class="offer-who">${typeBadge(o.type)} ${o.priority === 'urgent' ? '<span class="badge b-urgent">Urgent</span>' : ''} <b>${esc(o.customer_name)}</b></div>
        <div class="small" style="margin:.3rem 0">${where}</div>
        <div class="small">🕒 ${fmtTime(o.scheduled_at)} · ${relTime(o.scheduled_at)} · ${o.passengers} passenger${o.passengers > 1 ? 's' : ''}</div>
        ${o.notes ? `<div class="small">📝 ${esc(o.notes)}</div>` : ''}
        <div class="offer-actions"><button class="btn-green btn-lg" data-offer="accept">✅ Take it</button><button class="btn-ghost btn-lg" data-offer="decline">No thanks</button></div>
        <div class="offer-msg"></div>`;
      sheet.classList.remove('hidden');
    }
    async function check() {
      if (!me.on_duty || busy) return;
      const { offer } = await api('/api/offers/mine');
      if (!offer) { if (current) { current = null; paint(); } return; }
      if (!current || current.id !== offer.id) { current = offer; paint(); alerts.ding(); }
    }
    sheet.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-offer]'); if (!b || !current || busy) return;
      busy = true; const o = current;
      $$('[data-offer]', sheet).forEach((x) => { x.disabled = true; });
      try {
        if (b.dataset.offer === 'accept') {
          alerts.tookMyself([o.ride_id]);
          await api(`/api/offers/${o.id}/accept`, { body: {} });
          current = null; paint();
          await route.addRide(o.ride_id);
          refresh();
        } else {
          await api(`/api/offers/${o.id}/decline`, { body: {} });
          current = null; paint();
        }
      } catch (err) {
        $('.offer-msg', sheet).innerHTML = `<div class="alert alert-err">${esc(err.message)}</div>`;
        setTimeout(() => { current = null; paint(); refresh(); }, 2500);
      }
      busy = false;
    });
    // Count down; the offer goes to the next driver when time runs out.
    setInterval(() => {
      if (!current) return;
      const left = secondsLeft(current); const t = $('.offer-timer', sheet);
      if (!left) { current = null; paint(); } else if (t) t.textContent = `${left}s`;
    }, 1000);
    return { check };
  })();
  App.poll(offers.check, 4000, { background: true });

  App.liveDrivers(map, { exclude: me.id, routes: false });

  async function refresh() {
    // Notice if the shift was ended elsewhere (e.g. the automatic end of shift at night).
    const fresh = (await api('/api/me')).user;
    if (fresh && fresh.on_duty !== me.on_duty) {
      me = fresh;
      if (!me.on_duty) stopGps();
      drawShift();
    }
    const r = await api('/api/rides?scope=open');
    rides = r.queue.map((id) => r.rides.find((x) => x.id === id));
    alerts.check(rides);
    // Counts on the filter buttons are for the tab being viewed.
    const inTab = (x) => (tab === 'mine' ? x.driver_id === me.id : tab === 'open' ? !x.driver_id : true);
    for (const t of ['all', 'pickup', 'dropoff']) {
      $(`[data-count="${t}"]`).textContent = `(${rides.filter((x) => inTab(x) && (t === 'all' || x.type === t)).length})`;
    }
    const shown = typeFilter === 'all' ? rides : rides.filter((x) => x.type === typeFilter);
    const mine = shown.filter((x) => x.driver_id === me.id);
    const open = shown.filter((x) => !x.driver_id);
    $('#mineCount').textContent = `(${mine.length})`;
    $('#openCount').textContent = `(${open.length})`;
    const list = tab === 'mine' ? mine : tab === 'open' ? open : shown;
    const what = { all: '', pickup: ' pick ups', dropoff: ' drop offs' }[typeFilter];
    $('#list').innerHTML = list.length ? list.map((x) => rideHtml(x)).join('')
      : `<div class="empty">${tab === 'mine' ? `No${what || 'thing'} assigned to you. Check “Unassigned” to take a ride.` : `No${what || 'thing'} here right now.`}</div>`;

    await route.render();
    const routeNext = route.nextRideId() && rides.find((x) => x.id === route.nextRideId());
    const next = routeNext || mine[0] || open[0];
    $('#nextCard').classList.toggle('hidden', !next);
    if (next) $('#nextCard').innerHTML = `<h2>👉 Do this next${routeNext ? ' <span class="small muted">(next stop on your route)</span>' : what ? ` <span class="small muted">(${what.trim()} only)</span>` : ''}</h2>${rideHtml(next, true)}`;

    draw(shown, []); // other drivers are drawn live by App.liveDrivers
  }

  document.body.addEventListener('click', async (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    const host = btn.closest('[data-id]'); if (!host) return;
    const id = Number(host.dataset.id);
    try {
      if (btn.hasAttribute('data-claim')) alerts.tookMyself([id]);
      if (btn.hasAttribute('data-claim')) await api(`/api/rides/${id}`, { method: 'PATCH', body: { driver_id: me.id } });
      else if (btn.hasAttribute('data-release')) await api(`/api/rides/${id}`, { method: 'PATCH', body: { driver_id: null } });
      else if (btn.dataset.status) await api(`/api/rides/${id}`, { method: 'PATCH', body: { status: btn.dataset.status } });
      else if (btn.hasAttribute('data-cancel')) { if (!(await App.cancelRide(rides.find((x) => x.id === id)))) return; }
      else return;
      refresh();
    } catch (err) { alert(err.message); refresh(); }
  });

  const showType = () => $$('[data-type]').forEach((x) => x.classList.toggle('active', x.dataset.type === typeFilter));
  showType();
  $$('[data-type]').forEach((b) => b.onclick = () => {
    typeFilter = b.dataset.type; showType();
    try { localStorage.setItem('shuttle.typeFilter', typeFilter); } catch { /* storage blocked */ }
    refresh();
  });
  $$('[data-tab]').forEach((b) => b.onclick = () => {
    tab = b.dataset.tab; $$('[data-tab]').forEach((x) => x.classList.toggle('active', x === b)); refresh();
  });
  $('#recenter').onclick = () => {
    const pts = rides.filter((r) => r.lat != null).map((r) => [r.lat, r.lng]);
    pts.push([Number(App.settings.dealer_lat), Number(App.settings.dealer_lng)]);
    if (me.last_lat != null) pts.push([me.last_lat, me.last_lng]);
    map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
  };

  await drawShift();
  if (me.on_duty) { startGps(); drawShift(); }
  // Keep checking while the app is in the background so alerts still arrive (phones may slow this down).
  App.poll(refresh, 15000, { background: true });
})();
</script>
</body>
</html>

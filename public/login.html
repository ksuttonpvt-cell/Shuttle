<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* apply the saved light/dark choice before the page draws */try{var t=localStorage.getItem("shuttle.theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuttle Sign In</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shuttle">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="center-page">
  <div class="card auth-card">
    <div style="text-align:center;margin-bottom:1rem">
      <div style="font-size:2.4rem">🚐</div>
      <h1>Shuttle sign in</h1>
      <div class="muted" id="dealer">Staff only</div>
    </div>
    <form id="f">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div id="msg"></div>
      <button class="btn-block btn-lg" style="margin-top:1rem">Sign in</button>
    </form>
    <form id="forgot" class="hidden">
      <h2 style="margin-top:0">Reset your password</h2>
      <p class="small muted">Enter the email you sign in with. A shuttle admin will get an alert and send you a link to set a new password.</p>
      <label for="femail">Email</label>
      <input id="femail" name="email" type="email" autocomplete="username" required>
      <div id="fmsg"></div>
      <button class="btn-block btn-lg" style="margin-top:1rem">Ask for a reset link</button>
      <p class="small" style="text-align:center;margin-top:.8rem"><button type="button" class="linklike" id="backToLogin">← Back to sign in</button></p>
    </form>
    <p class="small muted" style="text-align:center;margin-top:1rem">
      <button type="button" class="linklike" id="forgotLink">Forgot your password?</button><br>
      Customer? <a href="/request">Request a shuttle ride</a>
    </p>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
(async () => {
  const { user, settings } = await App.api('/api/me');
  App.$('#dealer').textContent = settings.dealer_name + ' · staff only';
  const next = new URLSearchParams(location.search).get('next');
  const go = (u) => { location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/' + u.role; };
  if (user) return go(user);
  const showForgot = (on) => {
    App.$('#f').classList.toggle('hidden', on); App.$('#forgot').classList.toggle('hidden', !on);
    App.$('#forgotLink').parentElement.classList.toggle('hidden', on);
    if (on) { App.$('#femail').value = App.$('#email').value; App.$('#femail').focus(); } else App.$('#email').focus();
  };
  App.$('#forgotLink').onclick = () => showForgot(true);
  App.$('#backToLogin').onclick = () => showForgot(false);
  App.$('#forgot').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('.btn-lg'); btn.disabled = true;
    try {
      await App.api('/api/password-reset/request', { body: { email: App.$('#femail').value } });
      App.flash(App.$('#fmsg'), "Got it. If that email has an account, a shuttle admin has been alerted and will send you a reset link. You can also ask them in person.", true);
    } catch (err) { App.flash(App.$('#fmsg'), err.message); }
    btn.disabled = false;
  };
  App.$('#f').onsubmit = async (e) => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    try { const { user } = await App.api('/api/login', { body, allow401: true }); go(user); }
    catch (err) { App.flash(App.$('#msg'), err.message); }
  };
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* apply the saved light/dark choice and any look preview before the page draws */try{var t=localStorage.getItem("shuttle.theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;var q=new URLSearchParams(location.search).get("look");if(q==="branded"||q==="classic")localStorage.setItem("shuttle.look",q);else if(q==="off")localStorage.removeItem("shuttle.look");var l=localStorage.getItem("shuttle.look");if(l==="branded"||l==="classic")document.documentElement.dataset.look=l}catch(e){}</script><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Shuttle Ride</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="cust">
<div class="hero"><div data-brand class="brand-block"></div><div class="hero-emoji" style="font-size:2rem">🚐</div><h1 id="title">Your shuttle ride</h1><div id="dealer" style="color:#ccc"></div></div>
<main class="wrap grid cust-wrap">
  <div class="card here-card hidden" id="here" aria-live="assertive"></div>
  <div class="card" id="status" aria-live="polite"><div class="empty">Loading your ride…</div></div>
  <div class="cust-actions" id="actions"></div>
  <div class="card cust-map-card" id="mapCard"><div id="map" class="map"></div></div>
  <div class="card hidden" id="change"></div>
  <div class="card small muted" id="foot"></div>
</main>
<footer class="site-foot" data-foot></footer>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/common.js"></script>
<script>
(async () => {
  const { $, api, esc, fmtTime } = App;
  const token = location.pathname.split('/').pop();
  const link = `${location.origin}/t/${token}`;
  let map = null; let car = null; let fitted = false; let last = null; let changeOpen = null; let notice = null;
  const STEPS = [['requested', 'Requested'], ['assigned', 'Driver assigned'], ['en_route', 'On the way'], ['onboard', 'On board'], ['completed', 'Done']];
  const minsUntil = (iso) => Math.round((new Date(iso) - Date.now()) / 60000);
  const smsLink = (phone, text) => `sms:${phone.replace(/[^\d+]/g, '')}?&body=${encodeURIComponent(text)}`;

  // Once they're in the shuttle, show when things really happened, not the scheduled time
  // (a drop off's scheduled time includes the wait, so it's often later than the ride itself).
  function timeLine(ride) {
    const at = (iso) => `<b>${fmtTime(iso)}</b>`;
    if (ride.onboard_at && ['onboard', 'completed'].includes(ride.status)) {
      const start = ride.type === 'pickup' ? `Picked up ${at(ride.onboard_at)}` : `Left the ${App.place()} ${at(ride.onboard_at)}`;
      if (ride.status !== 'completed' || !ride.completed_at) return start;
      return `${start} · ${ride.type === 'pickup' ? `At the ${App.place()}` : 'Dropped off'} ${at(ride.completed_at)}`;
    }
    if (ride.status === 'completed' && ride.completed_at) return `Done ${at(ride.completed_at)}`;
    return `${ride.type === 'pickup' ? 'Pick up' : 'Leaving'} ${fmtTime(ride.scheduled_at)}`;
  }

  // The big line at the top: what's happening, in plain words, with a countdown when we have one.
  function bigLine(ride, eta, estimated) {
    if (ride.status === 'en_route' && eta) {
      const m = minsUntil(eta);
      return m <= 1 ? 'Your driver is almost there' : `Arriving in ${estimated ? 'about ' : ''}${m} min`;
    }
    if (ride.status === 'onboard' && eta) { const m = minsUntil(eta); return m <= 1 ? 'Almost there' : `About ${m} min to go`; }
    if ((ride.status === 'requested' || ride.status === 'assigned') && ride.scheduled_at) {
      const m = minsUntil(ride.scheduled_at);
      if (m > 90) return `Scheduled for ${fmtTime(ride.scheduled_at)}`;
      if (m > 1) return `Scheduled in ${m} min`;
    }
    return null;
  }

  function render(data) {
    const { ride, dealer, driver_location: loc, queue_position: pos, eta, eta_estimated: est } = data;
    $('#dealer').textContent = dealer.name;
    if (!document.querySelector('[data-brand] *')) App.applyBrand(dealer.name);
    const first = ride.customer_first_name;
    $('#title').textContent = ride.status === 'cancelled' ? `Hi ${first}, your ride is cancelled`
      : ride.status === 'completed' ? `Thanks, ${first}!`
        : ride.type === 'pickup' ? `Hi ${first}, we're coming to get you` : `Hi ${first}, your ride home`;
    document.title = `${ride.type === 'pickup' ? 'Shuttle pick up' : 'Your ride home'} · ${dealer.name}`;
    const open = ['requested', 'assigned', 'en_route', 'onboard'].includes(ride.status);

    let body;
    if (ride.status === 'cancelled') body = `<h2>This ride was cancelled</h2><p class="muted">${dealer.phone ? `Questions? Call ${esc(dealer.phone)}.` : 'Questions? Call us.'}</p>`;
    else {
      const idx = STEPS.findIndex(([st]) => st === ride.status);
      const steps = STEPS.map(([, label], i) => `<div class="step ${i < idx ? 'done' : i === idx ? 'now' : ''}"><i>${i < idx ? '✓' : i + 1}</i>${label}</div>`).join('');
      const driver = esc(ride.driver_name || 'Your driver');
      const headline = {
        requested: 'We got your request. A driver will be assigned shortly.',
        assigned: `${driver} will be your driver.`,
        en_route: `${driver} is on the way!`,
        onboard: ride.type === 'pickup' ? `Heading to the ${App.place()}.` : "You're on your way home.",
        completed: 'Ride complete. Thanks for choosing us!',
      }[ride.status];
      const big = bigLine(ride, eta, est);
      const veh = ride.vehicle;
      // Who's coming: photo (or first letter), name, van and plate.
      const driverCard = ride.driver_name && ['assigned', 'en_route', 'onboard'].includes(ride.status) ? `
        <div class="drv-card">
          ${data.driver_photo ? `<img class="drv-photo" src="${esc(data.driver_photo)}" alt="${esc(ride.driver_name)}">` : `<div class="drv-photo drv-initial" aria-hidden="true">${esc(ride.driver_name[0])}</div>`}
          <div class="drv-who"><b>${esc(ride.driver_name)}</b>${veh ? `<span>${esc([veh.color, veh.make_model].filter(Boolean).join(' ') || veh.name)}${veh.name && (veh.color || veh.make_model) ? ` · ${esc(veh.name)}` : ''}</span>` : ''}</div>
          ${veh && veh.plate ? `<div class="drv-plate" title="License plate">${esc(veh.plate)}</div>` : ''}
        </div>` : '';
      // How many stops the driver makes first.
      const n = data.stops_before;
      const stopsLine = n == null || data.arrived_at ? '' : n === 0
        ? (['assigned', 'en_route'].includes(ride.status) ? `<div class="stops-line"><b>You're next!</b></div>` : '')
        : `<div class="stops-line"><div class="stops-dots" aria-hidden="true">${'<i></i>'.repeat(Math.min(n, 6))}<i class="you"></i></div>
           <span><b>${esc(ride.driver_name || 'Your driver')}</b> has ${n} stop${n === 1 ? '' : 's'} before ${ride.status === 'onboard' ? 'yours' : 'you'}</span></div>`;
      body = `<div class="status-steps">${steps}</div>
        ${big && !data.arrived_at ? `<div class="cust-big">${esc(big)}</div>` : ''}
        ${stopsLine}
        <h2 class="cust-headline">${headline}</h2>
        ${driverCard}
        <div class="ride-meta cust-meta">
          <div>🕒 ${timeLine(ride)}</div>
          <div>📍 ${ride.type === 'pickup' ? 'From' : 'To'} ${esc(ride.address)}</div>
          ${veh && !driverCard && ride.status !== 'completed' ? `<div>🚐 Look for: <b>${esc([veh.color, veh.make_model].filter(Boolean).join(' ') || veh.name)}</b>${veh.plate ? ` · plate <b class="nowrap">${esc(veh.plate)}</b>` : ''}</div>` : ''}
          ${eta && open ? `<div>⏱ ${ride.status === 'onboard' ? 'Arriving' : ride.type === 'pickup' ? 'Driver expected' : 'Arriving'} around <b>${fmtTime(eta)}</b>${est ? ' (estimate)' : ''}</div>` : ''}
          ${pos && data.stops_before == null ? `<div>📋 You're #${pos} in the shuttle line</div>` : ''}
        </div>`;
    }
    $('#status').innerHTML = body;
    drawHere(data);

    // One-tap buttons.
    const buttons = [];
    if (dealer.phone) {
      buttons.push(`<a class="cust-btn" href="${App.telLink(dealer.phone)}"><span>📞</span>Call</a>`);
      buttons.push(`<a class="cust-btn" href="${smsLink(dealer.phone, `Hi, this is ${ride.customer_first_name} about my shuttle ride (${link}). `)}"><span>💬</span>Text us</a>`);
    }
    if (open && minsUntil(ride.scheduled_at) > 20 && ['requested', 'assigned'].includes(ride.status)) {
      buttons.push(`<a class="cust-btn" href="/api/public/track/${encodeURIComponent(token)}/calendar"><span>📅</span>Add to calendar</a>`);
    }
    if (open) buttons.push('<button type="button" class="cust-btn" id="shareBtn"><span>🔗</span>Share</button>');
    $('#actions').innerHTML = buttons.join('');
    $('#actions').classList.toggle('hidden', !buttons.length);
    if ($('#shareBtn')) $('#shareBtn').onclick = shareRide;

    // Running late / cancel.
    const ch = $('#change');
    ch.classList.toggle('hidden', !data.can_change);
    if (data.can_change && !changeOpen) {
      ch.innerHTML = `<h2>Need to change something?</h2>
        <div class="cust-change">
          <button type="button" class="btn-ghost" id="lateBtn">⏰ I'm running late</button>
          <button type="button" class="btn-ghost" id="cancelBtn">✖ Cancel my ride</button>
        </div><div id="changeMsg"></div>`;
      $('#lateBtn').onclick = late; $('#cancelBtn').onclick = cancel;
    }

    $('#mapCard').classList.toggle('hidden', !open);
    $('#foot').innerHTML = `${esc(dealer.name)} · ${esc(dealer.address)}<br>This page updates on its own. Last change ${fmtTime(ride.updated_at)}.`;
    // A thank-you stays on screen for a minute, even as the page updates itself.
    if (notice && Date.now() - notice.at < 60000) {
      const box = data.can_change ? $('#changeMsg') : $('#status');
      if (box && !box.querySelector('.alert-ok')) box.insertAdjacentHTML('beforeend', `<div class="alert alert-ok" style="margin-top:.6rem">${esc(notice.text)}</div>`);
    }

    if (open) {
      if (!map) {
        App.settings = { dealer_name: dealer.name, dealer_address: dealer.address, dealer_lat: dealer.lat, dealer_lng: dealer.lng };
        map = App.makeMap($('#map'), dealer, 12);
        App.dealerMarker(map, App.settings);
        if (ride.lat != null) L.marker([ride.lat, ride.lng], { icon: App.pinIcon(ride.type, '★') }).bindPopup('You').addTo(map);
      }
      if (loc) {
        if (car) App.glide(car, [loc.lat, loc.lng]);
        else car = L.marker([loc.lat, loc.lng], { icon: App.carIcon() }).bindPopup('Your shuttle').addTo(map);
      } else if (car) { car.remove(); car = null; }
      if (!fitted || (loc && !fitted.withCar)) {
        const pts = [[dealer.lat, dealer.lng]];
        if (ride.lat != null) pts.push([ride.lat, ride.lng]);
        if (loc) pts.push([loc.lat, loc.lng]);
        if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });
        fitted = { withCar: !!loc };
      }
    }
  }

  // "Your shuttle is here": the driver tapped I'm here. A timer shows how long they can wait.
  function drawHere(data) {
    const box = $('#here'); const r = data.ride;
    if (!data.arrived_at || !['assigned', 'en_route'].includes(r.status)) { box.classList.add('hidden'); box.innerHTML = ''; return; }
    const veh = r.vehicle; const who = esc(r.driver_name || 'Your driver');
    const look = veh ? `${esc([veh.color, veh.make_model].filter(Boolean).join(' ') || veh.name)}${veh.plate ? `, plate <b class="nowrap">${esc(veh.plate)}</b>` : ''}` : '';
    const replied = data.customer_reply;
    const canAnswer = data.can_change && !replied;
    const key = `${data.arrived_at}|${replied}|${data.can_change}`;
    if (box.dataset.key !== key) {
      box.dataset.key = key;
      box.innerHTML = `<div class="here-top"><span class="here-pill">${r.type === 'pickup' ? 'Your shuttle is here' : 'Your shuttle is out front'}</span><span class="here-timer" data-here-timer></span></div>
        <h2>${who} is ${r.type === 'pickup' ? 'outside' : `waiting at the ${App.place()}`}</h2>
        ${look ? `<p>Look for the ${look}.</p>` : ''}
        <p class="small muted" data-here-note></p>
        ${replied ? `<div class="alert alert-ok">${replied === 'coming' ? `${who} knows you're coming out.` : `${who} knows you need 5 more minutes.`}</div>` : ''}
        ${canAnswer ? `<div class="here-actions"><button type="button" class="btn-lg" data-reply="coming">I'm coming out</button><button type="button" class="btn-ghost" data-reply="need5">I need 5 more minutes</button></div>` : ''}
        <div data-here-msg></div>`;
      box.querySelectorAll('[data-reply]').forEach((b) => { b.onclick = async () => {
        box.querySelectorAll('[data-reply]').forEach((x) => { x.disabled = true; });
        try { await api(`/api/public/track/${encodeURIComponent(token)}/reply`, { body: { answer: b.dataset.reply } }); await load(); }
        catch (err) { App.flash($('[data-here-msg]', box), err.message); box.querySelectorAll('[data-reply]').forEach((x) => { x.disabled = false; }); }
      }; });
    }
    box.classList.remove('hidden');
    tickHere();
  }
  function tickHere() {
    const box = $('#here'); if (!last || box.classList.contains('hidden')) return;
    const left = Math.round((new Date(last.arrived_at).getTime() + (last.arrive_wait_min || 5) * 60000 - Date.now()) / 1000);
    const t = $('[data-here-timer]', box); const note = $('[data-here-note]', box);
    if (!t) return;
    const who = last.ride.driver_name || 'Your driver';
    if (left > 0) {
      t.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
      note.textContent = `${who} can wait about ${last.arrive_wait_min || 5} minutes.`;
    } else {
      t.textContent = '0:00';
      note.textContent = last.dealer.phone ? `Please come out now, or call us at ${last.dealer.phone}.` : 'Please come out now, or call us.';
    }
  }
  setInterval(tickHere, 1000);

  async function load() {
    let data;
    try { data = await api(`/api/public/track/${encodeURIComponent(token)}`); }
    catch (err) {
      if (last) return; // keep showing the last good view; it retries by itself
      $('#status').innerHTML = `<h2>We couldn't find that ride</h2><p>${esc(err.message)}</p>`;
      $('#mapCard').classList.add('hidden');
      return;
    }
    last = data; render(data);
  }

  async function shareRide() {
    const text = `Follow my shuttle ride from ${last ? last.dealer.name : `the ${App.place()}`}: ${link}`;
    if (navigator.share) { try { await navigator.share({ title: 'Shuttle ride', text, url: link }); return; } catch { return; } }
    try { await navigator.clipboard.writeText(link); App.flash($('#changeMsg') || $('#foot'), 'Link copied.', true); } catch { prompt('Copy this link:', link); }
  }

  function late() {
    changeOpen = 'late';
    const m = App.modal(`<h2>How late will you be?</h2>
      <p class="muted small">We'll let your driver know right away.</p>
      <div class="cust-late">${[[5, '5 min'], [10, '10 min'], [15, '15 min'], [20, '20+ min']].map(([v, l]) => `<button type="button" class="btn-ghost" data-min="${v}">${l}</button>`).join('')}</div>
      <div class="msg"></div>
      <div class="actions"><button type="button" class="btn-ghost" data-close>Never mind</button></div>`);
    m.addEventListener('close', () => { changeOpen = null; });
    m.querySelectorAll('[data-min]').forEach((b) => { b.onclick = async () => {
      try { const r = await api(`/api/public/track/${encodeURIComponent(token)}/late`, { body: { minutes: Number(b.dataset.min) } }); notice = { text: r.message, at: Date.now() }; m.close(); load(); }
      catch (err) { App.flash($('.msg', m), err.message); }
    }; });
  }

  function cancel() {
    changeOpen = 'cancel';
    const reasons = ['My plans changed', 'I found another ride', 'I don’t need the shuttle anymore', 'Other'];
    const m = App.modal(`<h2>Cancel your shuttle ride?</h2>
      <form>
        <div class="reasons">${reasons.map((r, i) => `<label class="check"><input type="radio" name="reason" value="${esc(r)}" ${i === 0 ? 'required' : ''}> ${esc(r)}</label>`).join('')}</div>
        <label>Anything we should know? <span class="muted">(needed for “Other”)</span></label>
        <textarea name="details" maxlength="200" rows="2"></textarea>
        <div class="msg"></div>
        <div class="actions"><button class="btn-dark">Cancel my ride</button><button type="button" class="btn-ghost" data-close>Keep my ride</button></div>
      </form>`);
    m.addEventListener('close', () => { changeOpen = null; });
    $('form', m).onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target.elements;
      try {
        const r = await api(`/api/public/track/${encodeURIComponent(token)}/cancel`, { body: { reason: f.reason.value, details: f.details.value } });
        notice = { text: r.message, at: Date.now() }; m.close(); await load();
      } catch (err) { App.flash($('.msg', m), err.message); }
    };
  }

  App.poll(load, 6000); // fast enough to watch the shuttle move
  setInterval(() => { if (last && !changeOpen) render(last); }, 30000); // keep the countdown current between updates
})();
</script>
</body>
</html>

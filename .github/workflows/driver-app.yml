# Builds the Turas Lúbtha Driver app (mobile/) for Android and iPhone.
#
# Every run checks and tests the app, then makes:
#   - turas-driver.apk  : installs on any Android phone (allow "install unknown apps")
#   - the iPhone build  : checked on a Mac; installing it needs an Apple Developer account (see README)
# With these repository secrets (Settings → Secrets and variables → Actions) the Android app is
# signed with your Google Play upload key and a turas-driver.aab for the Play Console is made too:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# or the single ANDROID_SIGNING_KEY made by the "Make app signing key" workflow.
# Phones only accept an update signed with the same key, so updates from the PC need one of these.
# With TURAS_UPLOAD_KEY (made on the Server page), each signed Android app built from main is sent
# to the shuttle PC (TURAS_SITE, default https://turaslubtha.com), and drivers' phones update from there.
name: Driver app

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/driver-app.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get

      - name: Set up the upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            # One secret: "<password>|<keystore in base64>", alias "upload".
            pass="${SIGNING_KEY%%|*}"
            echo "::add-mask::$pass"
            echo "${SIGNING_KEY#*|}" | base64 -d > "$RUNNER_TEMP/upload.jks"
            { echo "file=$RUNNER_TEMP/upload.jks"; echo "alias=upload"; } >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$pass" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key yet: the app is signed with a test key (fine for installing by hand; phones can't update from the PC until you run 'Make app signing key')." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEY_ALIAS: ${{ steps.key.outputs.alias || secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_FILE" ] || unset ANDROID_KEYSTORE_FILE
          export ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:-$KEYSTORE_PASSWORD_SECRET}"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$KEY_PASSWORD_SECRET}"
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}
          mkdir -p ../out && cp build/app/outputs/flutter-apk/app-release.apk ../out/turas-driver.apk
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}
            cp build/app/outputs/bundle/release/app-release.aab ../out/turas-driver.aab
          fi
          ls -l ../out

      - name: Send the app to the shuttle PC (drivers' phones update from there)
        if: github.ref == 'refs/heads/main' && steps.key.outputs.file != ''
        env:
          UPLOAD_KEY: ${{ secrets.TURAS_UPLOAD_KEY }}
          SITE: ${{ vars.TURAS_SITE || 'https://turaslubtha.com' }}
        run: |
          if [ -z "$UPLOAD_KEY" ]; then
            echo "Not sent to the shuttle PC: add the TURAS_UPLOAD_KEY secret (made on the Server page)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          for try in 1 2 3; do
            if curl --fail-with-body -sS -X POST "$SITE/api/app/upload" \
                 -H "Authorization: Bearer $UPLOAD_KEY" -H "X-App-Build: ${{ github.run_number }}" -H "X-App-Version: $version" \
                 -H "Content-Type: application/vnd.android.package-archive" --data-binary @../out/turas-driver.apk; then
              echo "Sent build ${{ github.run_number }} to $SITE. Phones will offer it as an update." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((try * 20))
          done
          echo "Couldn't send the app to $SITE (is the shuttle PC on?). The app is still attached to this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: turas-driver-android
          path: out/
          retention-days: 30

  ios:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Summary
        run: echo "The iPhone app builds. To put it on iPhones it needs signing with an Apple Developer account (see README)." >> "$GITHUB_STEP_SUMMARY"

# Builds the Turas Lúbtha Driver Android app (android/).
#
# Every run makes a test app (debug .apk) you can install on any Android phone.
# Add these repository secrets (Settings → Secrets and variables → Actions) to also get
# the Google Play build (signed .aab and .apk):
#   ANDROID_KEYSTORE_BASE64   the upload key (.jks file), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD its password
#   ANDROID_KEY_ALIAS         the key's alias
#   ANDROID_KEY_PASSWORD      the key's password
# The run's summary shows the key's SHA-256 fingerprint for site/app-links.json.
name: Android driver app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the test app
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Set up the release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release key yet: only the test app is built." >> "$GITHUB_STEP_SUMMARY"
            echo "have=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "have=yes" >> "$GITHUB_OUTPUT"

      - name: Build the Google Play app
        if: steps.key.outputs.have == 'yes'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease
          {
            echo "### Release key fingerprint (for site/app-links.json)"
            echo '```'
            keytool -list -v -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E 'SHA256:'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Rename the files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/turas-driver-test.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk out/turas-driver.apk; fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab out/turas-driver.aab; fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: turas-driver-app
          path: out/
          retention-days: 30
